# .github/workflows/pacman-repo.yml
#
# Publishes a signed pacman repository to GitHub Pages so that
# `yay -S aurscan-bin` and `yay -Syu` work without the AUR.
#
# Requires the secrets the `sign` job in ci.yml already uses:
#   GPG_PRIVATE_KEY, GPG_KEY_ID (optional), GPG_PASSPHRASE (optional)
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

name: pacman-repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, e.g. 0.7.1 (default: this repo state)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

env:
  REPO_NAME: manticore

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      pkgver: ${{ steps.sync.outputs.pkgver }}
    steps:
      - name: install tooling
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: create build user
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: sync PKGBUILDs to the release
        id: sync
        run: |
          ver='${{ github.event.inputs.version || github.event.release.tag_name }}'
          if [ -n "$ver" ]; then
            chmod +x packaging/sync-release.sh
            ./packaging/sync-release.sh "${ver#v}"
          fi
          pkgver="$(sed -n 's/^pkgver=//p' packaging/aurscan-bin/PKGBUILD)"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "Packaging aurscan-bin $pkgver"

      - name: import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1
          fi
          install -d -m 700 -o builder -g builder /home/builder/.gnupg
          printf 'allow-loopback-pinentry\n' > /home/builder/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n'  > /home/builder/.gnupg/gpg.conf
          chown builder:builder /home/builder/.gnupg/*.conf

          printf '%s\n' "$GPG_PRIVATE_KEY" | sudo -u builder gpg --batch --import
          if [ "$(sudo -u builder gpg --list-secret-keys --with-colons | grep -c '^sec')" -eq 0 ]; then
            echo "::error::GPG_PRIVATE_KEY imported no secret key"; exit 1
          fi

          want='${{ secrets.GPG_KEY_ID }}'
          if [ -n "$want" ]; then
            key="$want"
          else
            key="$(sudo -u builder gpg --list-secret-keys --with-colons \
                   | awk -F: '$1=="fpr"{print $10; exit}')"
          fi
          echo "SIGN_KEY=$key" >> "$GITHUB_ENV"
          printf '%s:6:\n' "$key" | sudo -u builder gpg --batch --import-ownertrust
          echo "Will sign with: $key"

      - name: build packages for both architectures
        run: |
          install -d -o builder -g builder /tmp/pkgout

          # aurscan-bin only repackages upstream's prebuilt binaries — nothing
          # is compiled — so the aarch64 package can be assembled on an x86_64
          # runner simply by overriding CARCH.
          #
          # Note: no --sign here. makepkg signs via `gpg --use-agent` with no
          # way to supply a passphrase, which cannot work unattended. Packages
          # are signed explicitly in the next step instead.
          for arch in x86_64 aarch64; do
            sed -e "s|^CARCH=.*|CARCH=\"$arch\"|" \
                -e "s|^CHOST=.*|CHOST=\"$arch-unknown-linux-gnu\"|" \
                /etc/makepkg.conf > "/tmp/makepkg-$arch.conf"
            chmod 0644 "/tmp/makepkg-$arch.conf"

            sudo -u builder \
              env PKGDEST=/tmp/pkgout HOME=/home/builder \
              makepkg --config "/tmp/makepkg-$arch.conf" \
                      --clean --cleanbuild --noconfirm \
                      -D packaging/aurscan-bin
          done
          ls -l /tmp/pkgout

      - name: sign the packages
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Detached, binary signatures — what pacman expects alongside each
          # package. Must happen before repo-add, which folds an existing .sig
          # into the database as the package's PGPSIG field.
          for pkg in /tmp/pkgout/*.pkg.tar.zst; do
            sudo -u builder env HOME=/home/builder GPG_PASSPHRASE="$GPG_PASSPHRASE" \
              gpg --batch --yes --pinentry-mode loopback \
                  ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
                  --local-user "$SIGN_KEY" \
                  --detach-sign --no-armor --output "$pkg.sig" "$pkg"
            sudo -u builder env HOME=/home/builder gpg --verify "$pkg.sig" "$pkg"
            echo "signed $(basename "$pkg")"
          done

      - name: assemble the pacman repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sign() {
            sudo -u builder env HOME=/home/builder GPG_PASSPHRASE="$GPG_PASSPHRASE" \
              gpg --batch --yes --pinentry-mode loopback \
                  ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
                  --local-user "$SIGN_KEY" \
                  --detach-sign --no-armor --output "$1.sig" "$1"
          }

          for arch in x86_64 aarch64; do
            install -d -o builder -g builder "site/$arch"
            cp /tmp/pkgout/*-"$arch".pkg.tar.zst*  "site/$arch/"
            chown -R builder:builder site

            # No --sign: repo-add signs through the agent too. Sign after.
            sudo -u builder env HOME=/home/builder \
              repo-add --new --remove \
                "site/$arch/$REPO_NAME.db.tar.gz" "site/$arch/"*.pkg.tar.zst

            sign "site/$arch/$REPO_NAME.db.tar.gz"
            sign "site/$arch/$REPO_NAME.files.tar.gz"

            # repo-add leaves .db/.files as symlinks; GitHub Pages does not
            # serve those, so replace them with real files.
            for ext in db files; do
              for suffix in '' '.sig'; do
                src="site/$arch/$REPO_NAME.$ext.tar.gz$suffix"
                dst="site/$arch/$REPO_NAME.$ext$suffix"
                [ -e "$src" ] || continue
                rm -f "$dst"
                cp "$src" "$dst"
              done
            done
          done
          touch site/.nojekyll
          find site -type f | sort

      - name: publish the signing key alongside the repository
        run: |
          sudo -u builder env HOME=/home/builder gpg --armor --export "$SIGN_KEY" > site/aurscan.gpg
          echo "$SIGN_KEY" > site/SIGNING_KEY_FINGERPRINT

      - name: commit the synced PKGBUILDs
        if: github.event_name == 'release'
        run: |
          if ! git diff --quiet -- packaging; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add packaging
            git commit -m "packaging: sync PKGBUILDs to v${{ steps.sync.outputs.pkgver }}"
            git push origin HEAD:"${GITHUB_REF_NAME}" || \
              git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
